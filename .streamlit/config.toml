[theme]
base = "light"
primaryColor = "#191919"
backgroundColor = "#FAFBFA"
secondaryBackgroundColor = "#EEF1EE"
textColor = "#202020"
font = "sans serif"
headingFont = "serif"
borderColor = "#DCDCD7"
baseRadius = "0.15rem"
buttonRadius = "0.15rem"
showWidgetBorder = true
showSidebarBorder = true
headingFontWeights = [500, 500, 500, 500, 500, 500]
headingFontSizes = ["36px", "28px", "22px", "18px", "16px", "14px"]
metricValueFontSize = "1.65rem"
chartCategoricalColors = ["#292929", "#777777", "#B0B0B0"]
redColor = "#444444"
blueColor = "#666666"
greenColor = "#444444"
orangeColor = "#666666"
redBackgroundColor = "#EFEEEA"
redTextColor = "#333333"
greenBackgroundColor = "#EFEEEA"
greenTextColor = "#333333"
linkColor = "#333333"
paddingTop = "2rem"
[theme.sidebar]
backgroundColor = "#F2F4F2"
secondaryBackgroundColor = "#FAFBFA"
[server]
headless = true
[browser]
gatherUsageStats = false
