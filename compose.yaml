name: stockproject

services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
  backend:
    build: .
    env_file: .env.local
    environment:
      DATA_DIR: /app/data
      QDRANT_URL: http://qdrant:6333
      DART_RAG_ENABLED: "1"
    volumes:
      - stock-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  frontend:
    build: .
    command: ["python", "-m", "streamlit", "run", "frontend/app.py", "--server.address", "0.0.0.0"]
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  stock-data:
  qdrant-data:
